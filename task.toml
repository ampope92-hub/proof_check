name = "proof-check"

# The one path the separate verifier collects from the agent's final container. A top-level key
# on purpose: Harbor ignores an artifacts list placed under [verifier].
artifacts = [
    "/app/proofcheck/src/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Software"
subcategory = "Algorithms"
tags = ["haskell", "sat", "drat", "proof-checking", "unit-propagation", "tcp"]
languages = ["haskell"]
difficulty = "advanced"
expert_time_estimate_hours = 6
is_multi_container = true
difficulty_explanation = """
The agent writes, as a GHC program, a forward checker for DRAT proofs that a formula is unsatisfiable, reads them page by page off a proof archive service, and reports for every job either OK or the proof line of the first addition that is neither RUP nor RAT on its first literal. Nothing in the jobs came off a real solver: solution/generate_archive.py builds each CNF and proof from a seed with a fixed recipe, together with the verdict it earns. The semantics are the textbook ones and the README states them in full: the formula at each line counts repeated clauses, a deletion takes out one copy of a clause named in any literal order, and every deletion takes effect.

The hard part is doing that exactly at scale. The held-back archive holds a job of 743,665 variables, 818,832 clauses and 1,166,617 proof lines, and a run gets 60 seconds and 2 GiB. The checker has to keep what the formula forces at the top level from line to line and propagate with watched literals: working the top level out again before every lemma, again after every deletion, or scanning every clause for RAT candidates all give the right verdicts on the shipped archive in one to three seconds and are all killed at the limit on the held-back one (at a quarter of its size they take 408, 656 and 120 seconds). Keeping that assignment is exactly what makes deletions dangerous. Solvers delete satisfied clauses, including the clause that forced a literal, and under the stated semantics the literal then stops being forced unless a unit or a second reason stands in for it. A checker that keeps its assignment through such a deletion, which is the reading drat-trim's default follows, accepts lemmas that fail and gets two shipped jobs and three held-back ones wrong, the large one among them; one that simply clears the literal gets every job but the two small RAT jobs wrong, because solvers restate a reason before deleting it; one that skips deletions of unit clauses gets both unit jobs wrong.

An expert has to see that only the deletion of a clause that is some literal's reason can change what the rest of the formula forces, track reasons, and rebuild the forced assignment in exactly that case, while RAT candidates come off occurrence lists that forget deleted clauses and the pivot stays the first literal as written. That is the everyday judgement of whoever maintains the proof checker behind a SAT competition track or a certified solver pipeline.
"""
solution_explanation = """
solve.sh copies solution/src (Main.hs and Archive/Conn.hs) into /app/proofcheck/src and runs build.sh. The program connects to PROOFS_HOST and PROOFS_PORT with the network library, opens a new connection whenever the current one has answered the number of requests its greeting announced, asks for JOBS and reads each job's cnf and proof pages by following the tokens. Clauses go into one flat Int32 arena. The checker keeps a top-level assignment with a trail and a reason per variable, two watched literals per clause held as linked lists in Int32 arrays, a per-literal occurrence list, and a hash of each clause's literal set.

An addition is checked by assuming its negation on top of the top-level assignment and propagating. If that finds no conflict and the clause is not empty, each live clause on the occurrence list of the negated first literal is tried with its other literals assumed false as well, and each attempt is taken back. An accepted addition is attached to two literals that are not false and, if it is unit or falsified at the top level, extends the top level or marks it in conflict. A deletion finds one live copy through the hash. If that copy is the recorded reason of a true literal, or the top level is in conflict, the top-level assignment is rebuilt from the unit clauses still in the formula; that is the only case in which a deletion can change what the formula forces, so nothing else is redone. The held-back run takes about 6 seconds inside the verifier.
"""
verification_explanation = """
tests/test.sh keeps only the regular .hs files under the collected src, builds them once as an unprivileged user with the ghc line from the README and GHC package environment files switched off, hands the binary to root, and runs it twice through a seccomp launcher that refuses every exec, under prlimit --as of 2 GiB and a 60 second KILL, from /app/proofcheck with PROOFS_HOST and PROOFS_PORT set. The first run reads the shipped archive served at 127.0.0.2 with 150-line pages and 5 requests per connection. The second reads the held-back archive, generated at image build from the recipe and required to match a SHA-256 manifest, reached by the host name proofs.archive.internal with 5000-line pages and 40 requests per connection. The tests compare every report line exactly, with only its line feed taken off, in archive order, and fail a run that reached the wall limit. The expected reports in tests/golden come from the generator's recipe; tests/golden_ref holds the same reports derived again from the archive files by solution/independent_check.py, a second checker written from the README alone, and the first test asserts the two sets agree.

Each archive carries one job per rule: a clean job that needs RAT on the first literal, deletions matched as sets, one copy of a relearned clause surviving a deletion and reasons restated before they are deleted; a lemma after one of its clauses was deleted; a unit that leans on a deleted unit clause; a lemma that needs a literal whose only reason was deleted; a clause that is RAT only on its second literal; a lemma accepted only because its resolvents are RUP without being tautological, which held back also has a unit whose middle resolvent of three is not RUP; and, held back, the large job. Seventeen one-edit variants of the reference went through this verifier and all score 0 on their own assertions: keeping the assignment through deletions, skipping unit deletions, clearing without re-deriving, any pivot, RUP only, deleting every copy, ignoring deletions, counting only additions, a fixed host, a printed report, no reconnect, accepting only vacuous or tautological resolvents, two spaces after the job name and a fixed six requests per connection give wrong verdicts, wrong lines or no report, while rebuilding after every deletion, rebuilding before every lemma and scanning for RAT candidates are killed at 60 seconds on the held-back run only. Against the same verifier the reference earns reward 1 and the stub as shipped earns 0.
"""
relevant_experience = """
Several years on SAT solver certification: writing the proof output of a conflict-driven solver, checking its DRAT proofs in CI, and tracking down proofs that one checker accepted and another rejected because the two read deletions of reason clauses differently.
"""

